filetree:
  depth: 2
  hidden: true
  paths:
    "config": "helpers partagés, chargés par `_setup.R`"
    "scripts": "un script par sortie, exécutés par `auto_exec()`"
    "scripts/_setup.R": "recodage des données et chargement de `config/`"
    "output": "figures et tableaux exportés (png, svg, html)"
    "rv": "bibliothèque et scripts d'amorçage rv"
    "index.qmd": "rapport statistique, source du rendu HTML"
    "tables.qmd": "export des tableaux vers Word"
    "backup.R": "sauvegarde locale des feuilles Google Sheets"
    "rproject.toml": "dépendances du projet"
    "rv.lock": "versions verrouillées des dépendances"
    ".Rprofile": "amorçage de rv à l'ouverture de la session"
    "air.toml": "configuration du formateur R"
  exclude:
    - "^output/"
    - "^rv/"
    - "^_extensions"
    - "^%.git$"
    - "^%.git/"
    - "^%.claude"
    - "^%.vscode"
    - "^%.quarto"
    - "_files$"
    - "^index%.html$"
    - "^tables%.docx$"
