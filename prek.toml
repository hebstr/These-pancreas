[[repos]]
repo = "local"
hooks = [
  { id = "prose-lint", name = "prose lint (.md/.qmd)", entry = "prose-lint", language = "system", files = '\.(md|qmd)$', exclude = '^_extensions/' },
  { id = "panache-format", name = "panache format (.md/.qmd)", entry = "panache format", language = "system", files = '\.(md|qmd)$', exclude = '^_extensions/' },
  { id = "metadata-only", name = "metadata-only rewrite (.docx/.pptx/.xlsx/.png)", entry = "prek-metadata-only", language = "system", files = '\.(docx|pptx|xlsx|png)$', require_serial = true },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=1500"], exclude = '^(docs|output)/' },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" },
]

[[repos]]
repo = "https://github.com/posit-dev/air-pre-commit"
rev = "0.11.0"
hooks = [
  { id = "air-format", files = '\.(R|r)$', exclude = '^_extensions/' },
]

[[repos]]
repo = "https://github.com/etiennebacher/jarl-pre-commit"
rev = "0.6.0"
hooks = [
  { id = "jarl-check", files = '\.(R|r)$', exclude = '^_extensions/' },
]
